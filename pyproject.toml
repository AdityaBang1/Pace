[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pace-academic-compiler"
version = "0.1.0"
description = "Reproducible local academic-document understanding prototype"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Pace ML contributors"}]
dependencies = ["numpy>=1.24", "scikit-learn>=1.3"]

[project.optional-dependencies]
render = ["reportlab>=4", "pillow>=10", "pypdfium2>=5"]
# Read a PDF or an image: pypdf for text layers, pypdfium2 to render pages.
ingest = ["pypdf>=6", "pypdfium2>=5", "pillow>=10"]
# Optional small OCR backend for pages with no text layer (ONNX, CPU-only).
ocr = ["rapidocr-onnxruntime>=1.2"]
train-transformer = ["torch>=2.2", "transformers>=4.40"]
coreml = ["coremltools>=8"]
test = ["pytest>=8"]

[project.scripts]
pace = "pace.cli:main"

[tool.setuptools.packages.find]
include = ["pace*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
